limit_req_zone $binary_remote_addr zone=otp:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sensitive:10m rate=20r/m;

upstream villaone_backend { server backend:8000; }
upstream villaone_frontend { server frontend:3001; }

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;
    client_max_body_size 6m;

    ssl_certificate /etc/letsencrypt/live/villaone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/villaone/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/auth/otp/request/ {
        limit_req zone=otp burst=3 nodelay;
        proxy_pass http://villaone_backend;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/v1/(bookings|marketplace/inquiries|support)/ {
        limit_req zone=sensitive burst=10 nodelay;
        proxy_pass http://villaone_backend;
        include /etc/nginx/proxy_params;
    }

    location /api/ { proxy_pass http://villaone_backend; include /etc/nginx/proxy_params; }
    location /admin/ { proxy_pass http://villaone_backend; include /etc/nginx/proxy_params; }
    location /health/ { proxy_pass http://villaone_backend; include /etc/nginx/proxy_params; }
    location /static/ { alias /srv/static/; expires 7d; }
    location /media/ { alias /srv/media/; expires 7d; }
    # Private payment proofs intentionally have no direct filesystem route.
    location / { proxy_pass http://villaone_frontend; include /etc/nginx/proxy_params; }
}
