name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: villaone_test
          POSTGRES_USER: villaone
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U villaone -d villaone_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DATABASE_URL: postgresql://villaone:test-password@127.0.0.1:5432/villaone_test
      DJANGO_SECRET_KEY: ci-only-secret-that-is-long-enough-and-never-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      CSRF_TRUSTED_ORIGINS: http://localhost:3001
      PAYMENT_MOCK_ENABLED: "false"
      OTP_DEBUG_CODE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --requirement requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py test --verbosity 2
      - run: pip-audit --requirement requirements-prod.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: villaone-backend:ci
