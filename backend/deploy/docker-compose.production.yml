name: villaone

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYMENT_MOCK_ENABLED: "false"
      OTP_DEBUG_CODE: ""
      SECURE_SSL_REDIRECT: "true"
      SECURE_HSTS_SECONDS: "31536000"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - public_media:/app/media
      - private_media:/app/private-media
      - static_files:/app/staticfiles

  frontend:
    build:
      context: ../../website
      args:
        NEXT_PUBLIC_VILLAONE_API_URL: /api/v1
        NEXT_PUBLIC_VILLAONE_SITE_URL: ${SITE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VILLAONE_INTERNAL_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_VILLAONE_API_URL: /api/v1
      NEXT_PUBLIC_VILLAONE_SITE_URL: ${SITE_URL}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/villaone.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/srv/static:ro
      - public_media:/srv/media:ro
      - ${TLS_DIRECTORY:-/etc/letsencrypt}:/etc/letsencrypt:ro

volumes:
  postgres_data:
  public_media:
  private_media:
  static_files:
