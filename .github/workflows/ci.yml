name: VillaOne release CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: villaone_test
          POSTGRES_USER: villaone
          POSTGRES_PASSWORD: villaone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U villaone -d villaone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DATABASE_URL: postgresql://villaone:villaone@127.0.0.1:5432/villaone_test
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      PAYMENT_MOCK_ENABLED: "false"
      OTP_DEBUG_CODE: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Run backend tests
        run: python manage.py test --verbosity 2
      - name: Build backend image
        run: docker build --tag villaone-backend:ci .

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_VILLAONE_API_URL: /api/v1
      NEXT_PUBLIC_VILLAONE_SITE_URL: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Check frontend performance budgets
        run: npm run check:budget
      - name: Rendered HTML smoke tests
        run: node --test tests/rendered-html.test.mjs
      - name: Build frontend image
        run: docker build --tag villaone-frontend:ci .

  compose:
    name: Release layout
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate release files
        shell: bash
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f backend/deploy/nginx/villaone.conf
          grep -q 'context: ../../frontend' backend/deploy/docker-compose.production.yml
      - name: Validate Compose configuration
        run: docker compose --env-file backend/deploy/.env.production.example -f backend/deploy/docker-compose.production.yml config
